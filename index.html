<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarGeoTech Solutions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b0b0d;
    color: #f2f2f2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .logo {
    max-width: 100%;
    width: 640px;
    border-radius: 8px;
    margin-bottom: 40px;
  }
  a.cv-button {
    display: inline-block;
    background: #f2f2f2;
    color: #0b0b0d;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 6px;
    transition: opacity 0.2s;
  }
  a.cv-button:hover { opacity: 0.85; }
  footer {
    margin-top: 60px;
    font-size: 13px;
    color: #777;
  }
</style>
</head>
<body>
  <img class="logo" src="logo.jpg" alt="MarGeoTech Solutions">
  <a class="cv-button" href="cv.pdf" target="_blank" rel="noopener">View CV</a>
  <footer>&copy; 2026 MarGeoTech Solutions</footer>
</body>
</html>
